version: '3.8'

services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpi_backend_dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb-dev:27017/kpi_dashboard
      - REDIS_URL=redis://redis-dev:6379
      - JWT_SECRET=dev-secret-key
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "run", "dev"]
    depends_on:
      - mongodb-dev
      - redis-dev

  frontend-dev:
    image: node:20-alpine
    container_name: kpi_frontend_dev
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend-dev

  mongodb-dev:
    image: mongo:7.0
    container_name: kpi_mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  redis-dev:
    image: redis:7-alpine
    container_name: kpi_redis_dev
    ports:
      - "6379:6379"

volumes:
  mongo_dev_data:
