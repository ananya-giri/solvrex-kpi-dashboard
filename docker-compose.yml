version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kpi_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kpi_dashboard
    volumes:
      - mongo_data:/data/db

  kpi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpi_dashboard_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/kpi_dashboard
      - JWT_SECRET=zero-spend-kpi-dashboard-secret-2026
    depends_on:
      - mongodb
    volumes:
      - ./backend/data:/app/backend/data

volumes:
  mongo_data:
