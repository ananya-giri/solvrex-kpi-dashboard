version: '3.8'

services:
  # ==============================================================
  # Nginx Gateway & Reverse Proxy / Load Balancer
  # ==============================================================
  gateway:
    image: nginx:alpine
    container_name: kpi_gateway
    restart: always
    ports:
      - "80:80"
      - "5000:80" # Allows access on port 5000 or port 80 interchangeably
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kpi_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==============================================================
  # React Frontend (Nginx Production Container)
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kpi_frontend
    restart: always
    expose:
      - "80"
    networks:
      - kpi_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ==============================================================
  # Node.js + Express API Backend (Horizontally Scalable)
  # Run `docker compose up --scale backend=3` to scale workers
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/kpi_dashboard
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=zero-spend-kpi-dashboard-production-secret-2026
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_backups:/usr/src/app/data/backups
    networks:
      - kpi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==============================================================
  # MongoDB Database (Persistent Storage)
  # ==============================================================
  mongodb:
    image: mongo:7.0
    container_name: kpi_mongodb
    restart: always
    expose:
      - "27017"
    environment:
      MONGO_INITDB_DATABASE: kpi_dashboard
    volumes:
      - mongo_data:/data/db
    networks:
      - kpi_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================
  # Redis In-Memory Cache (High Throughput KPI Caching)
  # ==============================================================
  redis:
    image: redis:7-alpine
    container_name: kpi_redis
    restart: always
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - kpi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

# ==============================================================
# Persistent Named Volumes & Networks
# ==============================================================
volumes:
  mongo_data:
    name: kpi_mongo_storage
  redis_data:
    name: kpi_redis_storage
  app_backups:
    name: kpi_app_backups

networks:
  kpi_network:
    name: kpi_dashboard_network
    driver: bridge
